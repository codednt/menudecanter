<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menù - DECANTER</title>
    <link rel="stylesheet" href="css/menu-style.css">
    <!-- Importa i dati del menu -->
    <script src="js/menu-data.js"></script>
    <script>applyGlobalTheme();</script>
</head>
<body>
    <div class="menu-container">
        <div class="header">
            <h1>MENÙ</h1>
            <p class="restaurant-name">DECANTER</p>
            <p class="subtitle-sm">Ristorante - Pizzeria</p>
        </div>

        <!-- Container vuoto che verrà riempito da Javascript -->
        <div id="dynamic-menu-content"></div>
    </div>

    <img src="img/logotrasp.png" alt="Logo DNTC" class="bottom-logo">

    <!-- Image Modal (Lightbox) -->
    <div id="imageModal" class="image-modal">
        <span class="image-modal-close">&times;</span>
        <img class="image-modal-content" id="modalImage">
    </div>

    <script src="js/menu-script.js"></script>
</body>
</html>
