<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Personale - Dashboard</title>
    <link rel="stylesheet" href="css/dashboard-style.css">
    <script src="js/menu-data.js"></script>
    <script>applyGlobalTheme();</script>
</head>
<body>

    <!-- Navigazione Superiore -->
    <div class="top-nav-group">
        <a href="index.html" class="top-nav-btn">⬅ Torna Indietro</a>
    </div>

    <header>
        <h1>BENVENUTO</h1>
        <p class="subtitle">Seleziona l'area da gestire</p>
    </header>

    <div class="dashboard-container">
        
        <div class="hub-grid">
            <!-- Sezione Gestione Menu -->
            <a href="gestionemenu.html" class="hub-card">
                <span style="font-size: 2em; margin-bottom: 10px;">🍽️</span>
                GESTIONE MENÙ
                <span style="font-size: 0.6em; opacity: 0.8; margin-top: 5px; font-weight: 400;">Modifica il tuo Menù Digitale</span>
            </a>

            <!-- Sezione Impostazioni -->
            <a href="impostazioni.html" class="hub-card">
                <span style="font-size: 2em; margin-bottom: 10px;">⚙️</span>
                IMPOSTAZIONI
                <span style="font-size: 0.6em; opacity: 0.8; margin-top: 5px; font-weight: 400;">Personalizza l'aspetto del Menù</span>
            </a>
        </div>

    </div>

    <img src="img/logotrasp.png" alt="Logo" class="bottom-logo">

    <script>
        // Richiedi password all'ingresso della Dashboard
        if (sessionStorage.getItem('auth_token') !== 'admin_logged') {
            const password = prompt("Inserisci password amministratore:");
            if (password === "admin") {
                sessionStorage.setItem('auth_token', 'admin_logged');
            } else {
                document.body.innerHTML = "<div style='text-align:center; padding:50px;'><h2>Accesso Negato</h2><a href='../index.html'>Torna alla Home</a></div>";
            }
        }
    </script>
</body>
</html>
